<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="食費と冷蔵庫">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>食費と冷蔵庫</title>
<style>
/* VOICE: 毎日使う家計簿・在庫アプリ。装飾より速さと読みやすさ
   IDEA: スマホ標準アプリのグループ化リスト（設定・ヘルスケア・家計簿アプリの作法）
   PICTURE: 予算バーとカテゴリのドーナツ、期限バッジ付きの在庫リスト、金額入りのカレンダー
   COLOUR and TYPE: グレーの地に白いカード、アクセントは朱色1色、状態色は緑・橙・赤。システムフォント
   LAYOUT: 大きな画面タイトル、セクション見出し+角丸リスト、下部タブ、編集はシート（キャンセル／保存） */
:root{color-scheme:light dark;
--bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--fill:light-dark(#e9e9ee,#2c2c2e);
--ink:light-dark(#111,#f5f5f7);--sub:light-dark(#6c6c72,#98989f);--sep:light-dark(#dcdce1,#38383a);
--ac:light-dark(#e04f29,#ff6b45);--ac-s:light-dark(#fdece6,#3b1e15);
--ok:light-dark(#1d9a4b,#32d15a);--warn:light-dark(#bd6c00,#ffa31a);--bad:light-dark(#d9302a,#ff4d44);
--sun:light-dark(#d9302a,#ff6961);--sat:light-dark(#1f6fd1,#64a8ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:600px;margin:0 auto;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:env(safe-area-inset-top) 12px 0 16px}
.tb{display:flex;align-items:center;gap:2px;min-height:56px}
.tb h1{flex:1;margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sync{font-size:13px;color:var(--sub);margin-right:6px}
.ib{position:relative;width:44px;height:44px;border:0;background:none;color:var(--ac);display:grid;place-items:center;border-radius:12px;flex:none;padding:0}
.tchip{min-height:32px;border:0;border-radius:99px;background:var(--ok);color:#fff;font-weight:700;padding:0 12px;font-size:14px;font-variant-numeric:tabular-nums;margin-right:4px}
.tchip[hidden]{display:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding:0 16px 24px}
.gh{font-size:13px;color:var(--sub);font-weight:400;margin:24px 16px 6px;display:flex;justify-content:space-between;gap:8px;line-height:1.4}
.gh:first-child{margin-top:4px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.pad{padding:16px}
.foot{font-size:13px;color:var(--sub);margin:6px 16px 0;line-height:1.5}
.note{font-size:13px;color:var(--sub);margin:14px 16px 0;line-height:1.5}
.r{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;position:relative;width:100%;background:none;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
div.r{cursor:default}
.r+.r::before,.r+.it::before,.it+.it::before,.it+.r::before,.fr+.fr::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.r .m{flex:1;min-width:0}
.t1{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{display:block;font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.wrap .t1,.wrap .t2{white-space:normal}
.v{color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}.v.b{color:var(--ink);font-weight:600}
.chev{width:8px;height:8px;border-right:2px solid var(--sep);border-top:2px solid var(--sep);transform:rotate(45deg);flex:none;margin:0 2px 0 -2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{color:var(--sub)}.small{font-size:13px}.danger{color:var(--bad)}.ok-c{color:var(--ok)}.warn-c{color:var(--warn)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}
.btn{position:relative;min-height:50px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;width:100%}
.btn.sec{background:var(--card);color:var(--ac)}.btn.sec.danger{color:var(--bad)}
.btn.tint{background:var(--ac-s);color:var(--ac)}
.btn:disabled{opacity:.45;cursor:default}
.link{border:0;background:none;color:var(--ac);font-size:17px;min-height:44px;padding:0 4px}
.link.strong{font-weight:600}.link:disabled{opacity:.4}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 55%,transparent);outline-offset:2px}
.fr{display:flex;align-items:center;gap:12px;min-height:50px;padding:3px 16px;position:relative}
.fr:focus-within{background:color-mix(in srgb,var(--fill) 50%,transparent)}
.fr>span:first-child{flex:none;min-width:5.5em}
.fr input,.fr select{flex:1;min-width:0;border:0;background:none;text-align:right;text-align-last:right;min-height:44px;padding:0;color:var(--sub);font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.fr input:focus{color:var(--ink)}
.fr input[type=checkbox]{flex:none;width:24px;min-height:24px;margin-left:auto;appearance:auto;-webkit-appearance:checkbox}
.fr .val{margin-left:auto;color:var(--sub);text-align:right}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);margin:0;flex:none}
.segc{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.segc button{flex:1;border:0;background:none;border-radius:8px;min-height:40px;font-size:14px;color:var(--ink);padding:0 4px;white-space:nowrap}
.segc button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.badge{font-size:13px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;flex:none}
.b-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.b-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.b-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.b-n{color:var(--sub);background:var(--fill)}
/* home */
.mrow{display:flex;align-items:center;justify-content:space-between;margin:-8px -8px 4px}
.mrow b{font-size:15px;font-weight:600}
.mrow .ib{color:var(--sub)}
.lbl{display:block;font-size:13px;color:var(--sub)}
.amt{font-size:clamp(32px,10vw,40px);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.prog{height:6px;border-radius:99px;background:var(--fill);overflow:hidden;margin:12px 0 6px}.prog i{display:block;height:100%;background:var(--ac);border-radius:99px}.prog.over i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;padding-top:12px;border-top:1px solid var(--sep)}
.kpis div{display:grid;gap:1px}.kpis div+div{padding-left:12px;border-left:1px solid var(--sep)}
.kpis b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:grid;grid-template-columns:minmax(0,1fr) 7em;gap:8px;margin-top:12px}
.donut{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center}
.donut svg{width:112px;height:112px;display:block}
.leg{display:grid;gap:7px;font-size:14px}
.leg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto 5.2em;gap:8px;align-items:center}
.leg i{width:10px;height:10px;border-radius:3px}.leg b{font-weight:600;text-align:right}
@media(max-width:350px){.donut{grid-template-columns:1fr}.donut svg{margin:0 auto}}
/* fridge */
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.sum3 div{padding:12px 6px;text-align:center}.sum3 div+div{border-left:1px solid var(--sep)}
.sum3 b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}.sum3 span{font-size:12px;color:var(--sub)}
.emptyc{text-align:center;color:var(--sub);padding:40px 16px 12px;line-height:1.6}.emptyc b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* fridge visual: 実物の冷蔵庫（扉・ガラス棚・ドアポケット・引き出し） */
.fleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--sub);margin:12px 4px 14px}
.fleg span{display:inline-flex;align-items:center;gap:6px}.fleg b{color:var(--ink);font-variant-numeric:tabular-nums}
.fleg i{width:9px;height:9px;border-radius:50%}.fleg .bad{background:var(--bad)}.fleg .warn{background:var(--warn)}.fleg .ok{background:var(--ok)}
.frg{--body:linear-gradient(160deg,light-dark(#fbfbfc,#3b3b40),light-dark(#dfe2e7,#26262a));position:relative;border-radius:24px;padding:9px;background:var(--body);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 14px 28px -16px rgba(0,0,0,.45),0 0 0 1px var(--sep);display:grid;gap:9px;margin:0 4px 20px}
.frg::before,.frg::after{content:"";position:absolute;bottom:-9px;width:30px;height:9px;border-radius:0 0 7px 7px;background:light-dark(#9da1a8,#55555b)}
.frg::before{left:26px}.frg::after{right:26px}
.cmp{--in:light-dark(#eef4f9,#182028);--glass:light-dark(rgba(150,180,205,.55),rgba(140,170,200,.3));position:relative;border-radius:15px;background:radial-gradient(120% 60% at 50% 0,light-dark(rgba(255,251,232,.95),rgba(255,240,200,.10)),transparent 70%),var(--in);box-shadow:inset 0 2px 8px rgba(0,0,0,.13),inset 0 0 0 1px rgba(0,0,0,.04)}
.cmp-l{position:absolute;top:6px;left:10px;font-size:12px;font-weight:600;color:var(--sub);display:flex;gap:5px;z-index:1;pointer-events:none}
.cmp-l b{font-weight:600;color:var(--ink);opacity:.6}
.ftop{display:grid;grid-template-columns:minmax(0,1fr) 100px;overflow:hidden;perspective:900px}
.shelves{display:flex;flex-wrap:wrap;align-content:flex-start;padding:26px 4px 0;min-height:314px;background:repeating-linear-gradient(to bottom,transparent 0 90px,var(--glass) 90px 93px,transparent 93px 96px) 0 26px/100% 100% no-repeat}
.door{padding:26px 6px 8px;background:light-dark(#f7f9fb,#1d2228);border-left:7px solid light-dark(#e1e4e9,#2c2f34);display:flex;flex-direction:column;gap:8px;box-shadow:inset 6px 0 10px -8px rgba(0,0,0,.35)}
.pocket{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:84px;padding-bottom:4px}
.pocket::after{content:"";position:absolute;left:-2px;right:-2px;bottom:0;height:26px;border-radius:2px 2px 9px 9px;background:light-dark(rgba(225,236,245,.72),rgba(80,100,120,.35));border:1px solid light-dark(rgba(140,165,190,.5),rgba(150,180,210,.25));pointer-events:none}
.fd{position:relative;width:66px;height:96px;border:0;background:none;padding:0 1px 7px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;color:var(--ink);border-radius:10px}
.fd svg{width:46px;height:46px;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.2));transition:transform .15s}
.fd:active svg{transform:translateY(-3px)}
.fd .nm{font-size:12px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd .tag{position:absolute;top:18px;right:0;z-index:1;font-size:11px;font-weight:700;line-height:1;color:#fff;border-radius:99px;padding:3px 6px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.fd .tag.bad{background:var(--bad)}.fd .tag.warn{background:var(--warn)}
.fd.sm{width:44px;height:80px;padding-bottom:3px}.fd.sm svg{width:36px;height:36px}.fd.sm .nm{position:relative;z-index:1;font-size:11px}.fd.sm .tag{top:2px;right:-4px;font-size:10px;padding:2px 5px}
.drw{padding:28px 6px 6px;min-height:124px}
.drw .items,.pantry .items{display:flex;flex-wrap:wrap}
.hdl{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:30%;height:7px;border-radius:9px;background:light-dark(#c4c8cf,#4b4c52);box-shadow:inset 0 1px 1px rgba(0,0,0,.15)}
.drw.vg{--in:light-dark(#edf6ea,#16211a)}
.drw.fz{--in:light-dark(#e8f0fb,#151e2b);background-image:radial-gradient(circle at 12% 30%,rgba(255,255,255,.55) 0 2px,transparent 3px),radial-gradient(circle at 78% 64%,rgba(255,255,255,.45) 0 1.5px,transparent 2.5px),radial-gradient(120% 60% at 50% 0,light-dark(rgba(255,255,255,.9),rgba(200,220,255,.08)),transparent 70%)}
.emp{font-size:13px;color:var(--sub);padding:14px 6px;opacity:.8}
.pantry{position:relative;margin:0 4px;border-radius:14px;padding:26px 6px 0;background:repeating-linear-gradient(to bottom,transparent 0 90px,light-dark(#b98d55,#6b5133) 90px 96px) 0 26px/100% 100% no-repeat,light-dark(#f4ead8,#2a231a);box-shadow:inset 0 2px 6px rgba(0,0,0,.1),0 0 0 1px var(--sep);min-height:122px}
.pantry .emp{padding-bottom:40px}
.door-cover{position:absolute;inset:0;z-index:4;border-radius:15px;background:var(--body,linear-gradient(160deg,#fbfbfc,#dfe2e7));background:linear-gradient(160deg,light-dark(#fbfbfc,#3b3b40),light-dark(#e3e6ea,#2a2a2f));box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transform-origin:left center;transform:perspective(900px) rotateY(0);animation:dopen .85s .2s cubic-bezier(.35,.6,.2,1) forwards;pointer-events:none}
.door-cover::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:34%;transform:translateY(-50%);border-radius:9px;background:light-dark(#c4c8cf,#4b4c52)}
@keyframes dopen{70%{opacity:1}to{transform:perspective(900px) rotateY(-100deg);opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.door-cover{display:none}.fd svg{transition:none}}
/* toolbar / plan extras / shopping mode */
.ftool{display:flex;align-items:center;gap:4px}.ftool .segc{flex:1}
.notes{display:grid;gap:6px;margin-top:12px}
.note-r{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:10px;padding:0 12px;min-height:44px}
.note-r span{flex:none;font-size:13px;color:var(--sub);width:2.6em}
.note-r input{flex:1;min-width:0;border:0;background:none;font-size:16px;min-height:44px;padding:0;outline:none}
.note-r:focus-within{box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 50%,transparent)}
.aisle-h{font-size:13px;color:var(--sub);margin:14px 16px 6px;display:flex;align-items:center;gap:6px}
.acts2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:12px}
.msg.note{align-self:center;background:none;color:var(--ok);font-size:13px;padding:2px 8px;max-width:95%;text-align:center}
.shop{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:0 16px calc(32px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.shop[hidden]{display:none}
.shop-h{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;min-height:52px;padding-top:env(safe-area-inset-top);margin:0 -16px;padding-left:10px;padding-right:10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.shop-h b{font-size:17px;font-weight:600}.shop-h>:last-child{justify-self:end}
.shop-p{background:var(--card);border-radius:12px;padding:12px 16px;margin-top:4px}.shop-p .prog{margin:0 0 8px;height:8px}.shop-p .prog i{background:var(--ok)}
.srow{min-height:60px}.srow .t1{font-size:18px}
.sck{width:28px;height:28px;border-radius:50%;border:2px solid var(--sep);display:grid;place-items:center;flex:none;color:#fff}
.sck svg{width:16px;height:16px;opacity:0}
.srow.done .sck{background:var(--ok);border-color:var(--ok)}.srow.done .sck svg{opacity:1}.srow.done .t1{text-decoration:line-through;color:var(--sub)}
.addin{flex:1;min-width:0;border:1px solid var(--sep);border-radius:20px;background:var(--card);min-height:44px;padding:0 14px;font-size:16px}
.arow{touch-action:none;background:var(--card);transition:box-shadow .15s}
.arow.dragging{z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.2);transition:none}
.adot{width:10px;height:10px;border-radius:3px;flex:none}
.amv{width:40px;height:40px;color:var(--sub)}.amv:disabled{opacity:.25}
.grip{width:44px;height:44px;display:grid;place-items:center;color:var(--sub);cursor:grab;touch-action:none;flex:none}
.seg2 button{min-height:52px;display:grid;place-items:center;align-content:center;line-height:1.25;font-size:15px}.seg2 small{font-size:12px;color:var(--sub);font-weight:400}
/* plan */
.meal-s{width:2.4em;font-size:13px;font-weight:600;color:var(--sub);flex:none}
.step{display:flex;align-items:center;gap:6px;margin-left:auto}.step button{width:40px;height:40px;border-radius:10px;border:0;background:var(--fill);font-size:20px;color:var(--ink);padding:0}
.step b{min-width:2.6em;text-align:center;font-weight:600}
.fr .segc{flex:1}
.done .t1{text-decoration:line-through;color:var(--sub)}
.adv{padding:14px 16px;white-space:pre-wrap;font-size:15px;line-height:1.7}
.loading{display:grid;place-items:center;gap:12px;padding:40px 0;text-align:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--sub);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* meal chips: 複数選択はチェック付きのチップ（Material Designのフィルターチップ型） */
.mchips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mchip{position:relative;border:1.5px solid var(--sep);background:var(--card);border-radius:14px;min-height:72px;display:grid;place-items:center;align-content:center;gap:4px;font-size:15px;color:var(--ink);padding:10px 4px;transition:background .15s,border-color .15s}
.mchip svg.i{width:26px;height:26px;color:var(--sub)}
.mchip .ck{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--sep);display:grid;place-items:center;color:#fff;background:var(--card)}
.mchip .ck svg{width:12px;height:12px;opacity:0}
.mchip[aria-pressed=true]{border-color:var(--ac);background:var(--ac-s);color:var(--ac);font-weight:600}
.mchip[aria-pressed=true] svg.i{color:var(--ac)}
.mchip[aria-pressed=true] .ck{background:var(--ac);border-color:var(--ac)}
.mchip[aria-pressed=true] .ck svg{opacity:1}
@media (prefers-reduced-motion:reduce){.mchip{transition:none}}
/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between;margin:-8px -8px 4px}.calh b{font-size:17px;font-weight:600}.calh .ib{color:var(--sub)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.wd{text-align:center;font-size:12px;color:var(--sub);padding-bottom:4px}.wd:first-child{color:var(--sun)}.wd:nth-child(7){color:var(--sat)}
.dc{border:0;background:none;color:inherit;min-height:60px;display:flex;flex-direction:column;align-items:center;padding:2px 0;font:inherit}
.dc.out{visibility:hidden}
.dc .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.dc.sun .n{color:var(--sun)}.dc.sat .n{color:var(--sat)}
.dc.today .n{color:var(--ac);font-weight:700}

nav.tabs{position:fixed;z-index:7;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;height:56px;display:grid;place-items:center;align-content:center;gap:1px;font-size:11px;color:var(--sub);padding:0}
nav.tabs button[aria-current=page]{color:var(--ac)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}

@keyframes up{from{transform:translateY(40px);opacity:.4}}

.sh-h>:first-child{justify-self:start}.sh-h>:last-child{justify-self:end}

.it{position:relative;padding:10px 16px}
.it1{display:flex;gap:8px;align-items:center}

.it2 .del{margin-left:auto;border:0;background:none;color:var(--bad);font-size:14px;min-height:36px;padding:0 2px}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--ink) 88%,transparent);color:var(--card);padding:10px 16px;border-radius:12px;max-width:90vw;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>

  <button data-act="go" data-v="fridge"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M6 10h12M9 5.5v2M9 13v3"/></svg>冷蔵庫</button>

<div class="sheet" id="sheet" hidden><button class="sheet-bg" data-act="closeSheet" aria-label="閉じる"></button><div class="sheet-body" role="dialog" aria-modal="true" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Math.round(+n||0).toLocaleString('ja-JP');
const cl=o=>JSON.parse(JSON.stringify(o??null));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=String(s||'').split('-').map(Number);return p.length===3&&p.every(x=>x>0)?new Date(p[0],p[1]-1,p[2]):new Date()};
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const WD='日月火水木金土';
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const uid36=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const median=a=>{if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const r1=n=>Math.round(n*10)/10;
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
const norm=n=>{const s=String(n||'');return s.replace(/[\s　]/g,'').replace(/[（(【\[].*?[)）】\]]/g,'').replace(/[0-9０-９.]+(g|ｇ|kg|ml|ｍｌ|l|L|個|本|枚|玉|袋|パック|P|入)?$/,'')||s};
const fmtQ=(q,u)=>u?`${+q||1}${u}`:`×${+q||1}`;
const CATS=['野菜','果物','肉','魚','卵・乳製品','豆腐・大豆','主食','調味料','冷凍食品','惣菜','飲料','菓子','日用品','その他'];
const SHELF={'野菜':5,'果物':5,'肉':3,'魚':2,'卵・乳製品':10,'豆腐・大豆':5,'主食':30,'調味料':120,'冷凍食品':60,'惣菜':2,'飲料':30,'菓子':60,'日用品':365,'その他':14};
const ZONES={fridge:'冷蔵室',veg:'野菜室',freezer:'冷凍室',pantry:'ストック棚'};
const zoneOf=(cat,sto)=>sto==='冷凍'||cat==='冷凍食品'?'freezer':(sto==='常温'||(['主食','調味料','飲料','菓子','日用品'].includes(cat)&&sto!=='冷蔵'))?'pantry':(cat==='野菜'||cat==='果物')?'veg':'fridge';
const MODES={
 zubora:{n:'ずぼら',s:'10分・洗い物少なめ',d:'1品10〜15分、レンジやワンパン中心、洗い物少なめ、カット野菜や市販の素もOK、同じ食材を使い回す'},
 balance:{n:'バランス',s:'20〜30分・一汁二菜',d:'1食20〜30分、主食・主菜・副菜(+汁物)をそろえ、たんぱく質と野菜(1日350g目安)をしっかり、作り置きも活用'},
 kodawari:{n:'こだわる',s:'時間をかけて丁寧に',d:'時間をかけてOK、旬の食材、出汁や下ごしらえから丁寧に、味付けや食感の変化、盛り付けまで楽しむ'}};
const MODE_IC={
 zubora:'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 20h24a12 12 0 0 1-24 0z" fill="var(--butter-s)"/><path d="M15 14c0-3 3-3 3-6"/></svg>',
 balance:'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="20" cy="22" r="13" fill="var(--leaf-s)"/><path d="M20 9v26M7 22h26"/></svg>',
 kodawari:'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24h28l-3 8H9z" fill="var(--tomato-s)"/><path d="M14 18c0-4 4-4 4-8M22 18c0-4 4-4 4-8M30 12l4-4"/></svg>'};
const IC={cam:'<svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 send:'<svg class="i" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>'};

/* ---------- state & storage ---------- */
const VIEWS=['home','fridge','plan','cal','chat'];
const S={docs:{},view:VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'home',month:today().slice(0,7),calMonth:today().slice(0,7),open:new Set(),confirm:null,
 chat:[],draft:'',chatImg:null,chatBusy:false,planBusy:false,po:null,selDate:null,timerEnd:0,checks:{},remote:false,synced:false};
try{S.checks=JSON.parse(localStorage.getItem('food-checks')||'{}')||{};S.fv=localStorage.getItem('food-fv')||'fridge'}catch(e){}
S.fAnim=S.view==='fridge';
let col=null,sample=null,imgOK=false,aiReady=false,R=null,F=null,T=null;
const chains={};
const get=k=>S.docs[k];
const settings=()=>{const s={budget:40000,people:1,mode:'balance',model:'',meals:['朝','昼','夜'],planDays:5,mealNotes:{},planNote:'',aisle:[],...(get('settings')||{})};if(!Array.isArray(s.meals)||!s.meals.length)s.meals=['朝','昼','夜'];if(!MODES[s.mode])s.mode='balance';return s};
const fridge=()=>(get('fridge')&&get('fridge').items)||[];
const history=()=>(get('history')&&get('history').events)||[];
const receipts=()=>Object.keys(S.docs).filter(k=>k.startsWith('r_')).map(k=>({...S.docs[k],id:k})).sort((a,b)=>(String(b.date)+(b.time||'')).localeCompare(String(a.date)+(a.time||'')));
const LS='food-app-v1';
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(S.docs))}catch(e){}};
const loadLocal=()=>{try{S.docs=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){S.docs={}}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function dbErr(e){console.warn(e);const c=e&&e.code;toast(c==='quota_exceeded'?'保存容量がいっぱいです。古いレシートを削除してください':c==='revoked'?'保存先に接続できなくなりました':'保存に失敗しました。もう一度お試しください')}
function queue(k,fn){const p=(chains[k]||Promise.resolve()).then(fn).catch(dbErr);chains[k]=p;return p}
async function retry(fn){try{return await fn()}catch(e){if(e&&e.code==='unavailable'){await wait(600+Math.random()*900);return fn()}throw e}}
function put(k,v){S.docs[k]=v;render();if(col)return queue(k,()=>retry(()=>col.doc(k).set(v)));saveLocal();return Promise.resolve()}
function del(k){delete S.docs[k];render();if(col)return queue(k,()=>retry(()=>col.doc(k).delete()));saveLocal();return Promise.resolve()}
const setFridge=items=>put('fridge',{items});
function logEnd(f,waste){const ev=[...cl(history()),{n:norm(f.name),name:f.name,cat:f.cat,qty:+f.qty||1,unit:f.unit||'',bought:f.added||today(),end:today(),waste:!!waste}].slice(-400);return put('history',{events:ev})}

/* ---------- learning ---------- */
function stats(){
 const st={};const g=n=>st[n]||(st[n]={n,name:'',cat:'',unit:'',buys:[],qtys:[],prices:[],durs:[],waste:0,ends:0});
 for(const r of receipts())for(const it of r.items||[]){if(!it.name)continue;const s=g(norm(it.name));s.name=s.name||it.name;s.cat=it.category||s.cat;s.unit=it.unit||s.unit;if(isDate(r.date))s.buys.push(r.date);s.qtys.push(+it.qty||1);s.prices.push(+it.price||0)}
 for(const e of history()){const s=g(e.n||norm(e.name));s.name=s.name||e.name;s.cat=s.cat||e.cat;s.ends++;if(e.waste)s.waste++;else if(isDate(e.bought)&&isDate(e.end))s.durs.push(Math.max(1,diffD(e.bought,e.end)))}
 for(const s of Object.values(st)){const b=[...new Set(s.buys)].sort();s.buyDates=b;s.last=b[b.length-1]||null;const gaps=b.slice(1).map((d,i)=>diffD(b[i],d)).filter(x=>x>0);s.interval=gaps.length?avg(gaps.slice(-5)):null;s.dur=s.durs.length?avg(s.durs.slice(-5)):null;s.q=median(s.qtys)||1;s.price=median(s.prices);s.wasteRate=s.ends?s.waste/s.ends:0}
 return st}
function trips(){
 const t=today(),pl=get('plan');const rs=[...new Set(receipts().map(r=>r.date).filter(isDate))].sort();
 const gaps=rs.slice(1).map((d,i)=>diffD(rs[i],d)).filter(x=>x>0);const learned=gaps.length>0;
 if(pl&&isDate(pl.shopDate)&&+pl.ndays>0){const N=+pl.ndays;const all=[];let d=pl.shopDate;for(let k=0;k<40&&all.length<60;k++){all.push(d);d=addD(d,N)}
  let dates=all.filter(x=>x>=t).slice(0,6);if(pl.shopDate<t&&(pl.shopping||[]).some(x=>!x.done)&&!dates.includes(t))dates=[t,...dates].slice(0,6);
  return {iv:N,dates,all,learned,fromPlan:true,planShop:pl.shopDate>=t?pl.shopDate:dates[0]}}
 const iv=clamp(Math.round(avg(gaps.slice(-6)))||7,2,14);const start=rs.includes(t)?addD(t,1):t;
 const last=rs[rs.length-1];let first=last?addD(last,iv):start;if(first<start)first=start;
 const dates=[first,addD(first,iv),addD(first,iv*2)];return {iv,dates,all:dates,learned,fromPlan:false,planShop:null}}
function shopItems(){const pl=get('plan'),ex=(get('extra')&&get('extra').items)||[];
 const a=(pl&&pl.shopping||[]).map((x,i)=>({key:'p:'+i,name:x.name,qty:x.qty,unit:x.unit||'',price:+x.price||0,category:x.category||'その他',why:x.why||'',done:!!x.done,plan:true}));
 const b=ex.map(x=>({key:'e:'+x.id,name:x.name,qty:x.qty||1,unit:x.unit||'',price:+x.price||0,category:x.category||'その他',why:'追加したもの',done:!!x.done,date:x.date||'',extra:true}));
 return {plan:a,extra:b}}
function suggest(){
 const st=stats(),tr=trips(),{iv,dates,learned,fromPlan}=tr,t=today();const out=dates.map(d=>({date:d,items:[]}));const seen=new Set();
 const qtyFor=s=>{let q=s.q;if(s.wasteRate>=.3)q=Math.max(1,Math.round(q*.7));return q};
 const whyFor=(s,need)=>[s.dur?`平均${r1(s.dur)}日で使い切り`:'',s.interval?`約${Math.round(s.interval)}日ごとに購入`:'',s.wasteRate>=.3?'捨てがちなので少なめ':'',`${md(need)}頃なくなる見込み`].filter(Boolean).join('・');
 const si=shopItems();
 if(out.length){const k0=Math.max(0,out.findIndex(o=>o.date===tr.planShop));for(const x of si.plan){seen.add(norm(x.name));out[k0].items.push(x)}
  for(const x of si.extra){let k=x.date?out.findIndex(o=>o.date>=x.date):0;if(k<0)k=0;seen.add(norm(x.name));out[k].items.push(x)}}
 const place=it=>{for(let k=0;k<out.length;k++){const next=dates[k+1]||addD(dates[k],iv);if(it.need<next){it.key='c:'+out[k].date+'|'+it.name;it.done=!!S.checks[it.key];out[k].items.push(it);return}}};
 for(const f of fridge()){const n=norm(f.name),s=st[n];if(!s||seen.has(n))continue;const repeat=s.buyDates.length>=2;if(!repeat&&(+f.left||0)>.25)continue;
  let need=isDate(f.exp)?f.exp:addD(t,7);if(s.dur&&isDate(f.added)){const e=addD(f.added,Math.round(s.dur));if(e<need)need=e}if((+f.left||0)<=.25){const e=addD(t,1);if(e<need)need=e}
  seen.add(n);place({n,name:f.name,need,qty:qtyFor(s),unit:s.unit||f.unit||'',price:s.price,category:s.cat||f.cat||'その他',why:whyFor(s,need)})}

function appCtx(){const set=settings(),t=today(),now=new Date(),pl=get('plan'),sg=suggest();

 L.push(`設定: 月の予算${yen(set.budget)} / 人数${set.people}人 / 自炊レベル${(MODES[set.mode]||MODES.balance).n} / 作る食事${set.meals.map(slotName).join('・')} / 献立の期間${set.planDays||5}日 / 食事ごとの要望 ${MEALS.map(([v,n])=>(set.mealNotes||{})[v]?n+':'+(set.mealNotes||{})[v]:'').filter(Boolean).join('、')||'なし'} / 全体の要望 ${set.planNote||'なし'}`);
 L.push(`今月の食費: ${yen(spent)}（${mt.length}回）${set.budget?' / 残り '+yen(set.budget-spent):''}`);
 L.push('最近のレシート: '+(receipts().slice(0,8).map(r=>`[id:${r.id}] ${r.date} ${r.store||'お店'} ${yen(r.total)}（${(r.items||[]).slice(0,8).map(i=>i.name).join('、')}）`).join(' / ')||'なし'));
 L.push('冷蔵庫: '+(fridge().slice().sort((a,b)=>String(a.exp).localeCompare(String(b.exp))).map(f=>`[id:${f.id}] ${f.name}(${f.cat}・${ZONES[f.zone]||'冷蔵室'}・${fmtQ(f.qty,f.unit)}・残り${Math.round((+f.left||0)*100)}%・期限まで${diffD(t,f.exp)}日)`).join(' / ')||'空'));
 if(pl)L.push(`献立(${pl.ndays||''}日分・買い物日${pl.shopDate||'未定'}): `+(pl.days||[]).map(d=>`${d.date} `+(d.meals||[]).map(m=>slotName(m.slot)+':'+m.name).join('、')).join(' / '));

 return L.join('\n')}

const claudeTools=()=>TOOLS.map(t=>({name:t.name,description:t.description,inputSchema:t.schema,execute:i=>{try{return t.run(i||{})}catch(e){return {ok:false,error:String(e&&e.message||e)}}}}));
const gSchema=s=>{if(!s||typeof s!=='object')return s;const o={};for(const [k,v] of Object.entries(s)){if(k==='type')o.type=String(v).toUpperCase();else if(k==='properties'){o.properties={};for(const [pk,pv] of Object.entries(v))o.properties[pk]=gSchema(pv)}else if(k==='items')o.items=gSchema(v);else o[k]=v}return o};
async function geminiTools(input,x){const msgs=typeof input==='string'?[{role:'user',content:input}]:input;
 const contents=msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:String(m.content||'')}]}));
 if(x.images&&x.images.length){const last=contents[contents.length-1];for(const im of x.images)last.parts.push({inline_data:{mime_type:im.type||'image/jpeg',data:await b64(im)}})}
 const tools=[{functionDeclarations:TOOLS.map(t=>({name:t.name,description:t.description,parameters:gSchema(t.schema)}))}];
 for(let step=0;step<6;step++){let res;try{res=await fetch(GAPI+'models/'+encodeURIComponent(gemModel())+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':gemKey()},body:JSON.stringify({contents,tools})})}catch(e){throw {code:'network'}}
  if(!res.ok)throw await gemFail(res);const j=await res.json();const cand=(j.candidates||[])[0]||{};const content=cand.content||{role:'model',parts:[]};const parts=content.parts||[];
  const calls=parts.filter(p=>p&&p.functionCall);const text=parts.filter(p=>p&&p.text&&!p.thought).map(p=>p.text).join('');
  if(!calls.length){if(x.onText)x.onText({text,delta:text});return {text}}
  contents.push({role:'model',parts});const resp=[];
  for(const p of calls){const fc=p.functionCall,t=TOOLS.find(t=>t.name===fc.name);let out;try{out=t?t.run(fc.args||{}):{ok:false,error:'不明なツール'}}catch(e){out={ok:false,error:String(e&&e.message||e)}}
   resp.push({functionResponse:{...(fc.id?{id:fc.id}:{}),name:fc.name,response:{result:out}}})}
  contents.push({role:'user',parts:resp})}
 return {text:'（処理が多すぎたため途中で止めました）'}}

let tt=null;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
let tInt=null,actx=null;
function beep(){if(!actx)return;try{for(let i=0;i<4;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t0=actx.currentTime+i*.45;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.35);o.start(t0);o.stop(t0+.4)}}catch(e){}}
function tick(){const el=$('#hTimer');if(!S.timerEnd){el.hidden=true;return}const ms=S.timerEnd-Date.now();
 if(ms<=0){S.timerEnd=0;clearInterval(tInt);el.hidden=true;beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}toast('タイマー終了！');return}
 const s=Math.ceil(ms/1000);el.hidden=false;el.textContent=`${Math.floor(s/60)}:${pad(s%60)}`}

- 冷蔵庫にあるもの（期限が近い順）: ${fridgeSummary()||'ほぼ空'}
- よく買う食材: ${top||'データなし'}
ルール: 要望を最優先する。市販品で済ませる指定（例: フルグラ）は、その食品名を料理名にして、手持ちがなければ買い物リストに入れる。期限が近い食材から優先して使い切る。たんぱく質・野菜・主食のバランスを1日単位で整える。同じ主菜を続けない。自炊モードの手間に合わせる。買い物リストは冷蔵庫にあるものを除き、期間中に必要な量を${set.people}人分でまとめる。price はその数量での日本の一般的なスーパーの税込の想定価格（円・整数）。合計が予算の目安を超えないようにする。塩・砂糖・醤油・味噌・油などの基本調味料は持っている前提。tipは20字程度。
形式:
{"summary":"この献立のねらいを1〜2文","nutrition":"栄養面のポイントを1〜2文","days":[{"date":"YYYY-MM-DD","meals":[{"slot":"朝|昼|夜","name":"料理名","minutes":15,"uses":["冷蔵庫から使う食材"],"tip":"ひとこと"}]}],"shopping":[{"name":"食材名","qty":1,"unit":"個","category":"${CATS.join('|')}","price":198,"why":"何に使うか"}]}`;
  try{const r=await ai(prompt,{json:true});const j=parseJSON(r.text);
   const days=(Array.isArray(j.days)?j.days:[]).filter(d=>d&&Array.isArray(d.meals)).map(d=>({date:isDate(d.date)?d.date:today(),meals:d.meals.map(m=>({slot:String(m.slot||''),name:String(m.name||''),minutes:Math.round(+m.minutes)||'',uses:(Array.isArray(m.uses)?m.uses:[]).map(String),tip:String(m.tip||'')})).sort((a,b)=>(SLOT_ORD[a.slot]??9)-(SLOT_ORD[b.slot]??9))})).sort((a,b)=>a.date.localeCompare(b.date));
   if(!days.length)throw new Error('empty');
   const shopping=(Array.isArray(j.shopping)?j.shopping:[]).map(x=>({name:String(x.name||''),qty:+x.qty||1,unit:String(x.unit||''),category:CATS.includes(x.category)?x.category:'その他',price:Math.max(0,Math.round(+x.price)||0),why:String(x.why||''),done:false})).filter(x=>x.name);
   S.planBusy=false;put('plan',{created:today(),start:{date:st.date,slot:st.slot},ndays:nd,shopDate,budget:tripBudget,mode:set.mode,meals:set.meals,people:set.people,days,shopping,summary:String(j.summary||''),nutrition:String(j.nutrition||'')});
   toast(shopping.length?`献立ができました。${md(shopDate)}の買い物リストに入れました`:'献立ができました')}
  catch(e){S.planBusy=false;render();if(e&&e.code)aiErr(e);else toast('うまく作れませんでした。日数を減らしてもう一度お試しください')}},
 sChk:v=>toggleItem(v),
 cook:v=>{S.draft=`「${v}」を作ります。材料と最初の手順を教えて`;A.go('chat')},
 selD:v=>{S.selDate=v;S.calMonth=v.slice(0,7);render()},
 copyTrip:v=>{const x=suggest().trips.find(t=>t.date===v);if(!x)return;const txt=`${md(v)} の買い物\n`+groupAisle(x.items.filter(i=>!i.done)).map(([c,g])=>`【${c}】\n`+g.map(i=>`・${i.name} ${fmtQ(i.qty,i.unit)}`).join('\n')).join('\n');
  try{navigator.clipboard.writeText(txt).then(()=>toast('コピーしました'),()=>toast('コピーできませんでした'))}catch(e){toast('コピーできませんでした')}},
 shopOpen:v=>{S.shop=v||today();renderShop();try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{S.wl=l}).catch(()=>{})}catch(e){}},
 shopClose:()=>{S.shop=null;renderShop();try{S.wl&&S.wl.release()}catch(e){}S.wl=null;render()},
 shopAdd:()=>{const el=$('#shopAdd');const v=el&&el.value.trim();if(!v)return;addShopItem({name:v},S.shop);toast(`「${v}」を追加しました`);setTimeout(()=>{const e2=$('#shopAdd');e2&&e2.focus()},50)},
 aisleOpen:()=>{if(!$('#sheet').hidden)closeSheet();S.aisleTmp=aisle();renderAisle()},
 aMove:(v,b)=>{const i=+v,d=+b.dataset.d,o=S.aisleTmp,j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];renderAisle()},
 aisleReset:()=>{S.aisleTmp=[...AISLE_DEFAULT];renderAisle()},
 aisleSave:()=>{setS({aisle:[...S.aisleTmp]});closeSheet();toast('売り場の順番を保存しました')},
 quick:v=>send(v),
 send:()=>send(),
 unattach:()=>{S.chatImg=null;renderChat()},
 tStart:v=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}S.timerEnd=Date.now()+(+v)*60000;clearInterval(tInt);tInt=setInterval(tick,500);tick();toast(`${v}分のタイマーを始めました`)},
 tStop:()=>{S.timerEnd=0;clearInterval(tInt);tick();toast('タイマーを止めました')}
};
async function send(text){const msg=String(text??S.draft).trim();const img=S.chatImg;if((!msg&&!img)||S.chatBusy)return;if(!aiOn()){aiErr({code:'none'});return}
 S.chat.push({role:'user',content:msg||'この写真を見てアドバイスして',img:img?URL.createObjectURL(img):null});if(text===undefined)S.draft='';S.chatImg=null;S.chatBusy=true;
 const bot={role:'assistant',content:'…'};S.chat.push(bot);renderChat();const bubble=$('#msgs').lastElementChild;
 const hist=S.chat.filter(m=>m.role!=='note').slice(0,-1).slice(-16);while(hist.length&&hist[0].role!=='user')hist.shift();
 const input=hist.map((m,i)=>({role:m.role,content:(i===0?ctx()+'\n\n---\n':'')+(m.content||'(写真)')}));
 const opts={tools:true,onText:({text})=>{bot.content=text;bubble.textContent=text;window.scrollTo(0,document.body.scrollHeight)}};
 if(img&&canImg()){try{opts.images=[await shrink(img,1400)]}catch(e){opts.images=[img]}}
 notesBuf=[];
 try{const r=await ai(input,opts);bot.content=r.text||bot.content}catch(e){bot.content='（うまく答えられませんでした。もう一度送ってください）';aiErr(e)}
 const ns=notesBuf||[];notesBuf=null;if(ns.length){const i=S.chat.indexOf(bot);S.chat.splice(i,0,...ns.map(c=>({role:'note',content:'✓ '+c})))}
 if(!String(bot.content).trim()||bot.content==='…')bot.content=ns.length?'変更しました。':'（返答がありませんでした）';
 S.chatBusy=false;if(S.view==='chat')renderChat()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='INPUT'&&b.type==='checkbox'){A[b.dataset.act]&&A[b.dataset.act](b.dataset.v,b,e);return}
 const fn=A[b.dataset.act];if(fn){e.preventDefault();fn(b.dataset.v,b,e)}});
function onIn(e){const t=e.target;
 if(t.type==='file'){if(e.type!=='change')return;const f=t.files&&t.files[0];t.value='';if(!f)return;if(t.id==='importFile'){f.text().then(x=>{S.importText=x;S.importSure=false;renderImport();toast('ファイルを読み込みました。「読み込む」を押してください')});return}if(t.classList.contains('scanIn'))onReceiptFile(f);else if(t.id==='chatFile'){S.chatImg=f;S.draft=($('#chatIn')||{}).value||S.draft;renderChat()}return}
 if(t.dataset.rf!==undefined&&R){const it=R.items[+t.dataset.ri];if(!it)return;it[t.dataset.rf]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.rf==='price'||t.dataset.rf==='qty')updTotal();return}
 if(t.dataset.rh&&R){R[t.dataset.rh]=t.value;return}
 if(t.dataset.ff&&F){F[t.dataset.ff]=t.value;if(t.dataset.ff==='cat'&&F._new&&e.type==='change'){F.zone=zoneOf(t.value,'');F.exp=addD(F.added||today(),SHELF[t.value]||7);renderF()}return}
 if(t.dataset.pn!==undefined){if(e.type==='change'){const mn={...(settings().mealNotes||{})};mn[t.dataset.pn]=t.value.trim();setS({mealNotes:mn})}return}
 if(t.dataset.pnote){if(e.type==='change')setS({planNote:t.value.trim()});return}
 if(t.dataset.tf&&T){T[t.dataset.tf]=t.type==='checkbox'?t.checked:t.value;return}
 if(t.id==='chatIn'){S.draft=t.value;grow()}}
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
document.addEventListener('keydown',e=>{if(e.target.id==='shopAdd'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();A.shopAdd();return}if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();if(e.target.id==='chatIn'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send()}});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)){S.view=v;if(v==='fridge')S.fAnim=true;window.scrollTo(0,0);render(true)}});

/* ---------- boot ---------- */
loadLocal();render(true);
if(!inClaude){try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}}
(async()=>{
 const cu=window.claude&&window.claude.use?n=>window.claude.use(n):null;
 if(!cu){aiReady=true;render(true);return}
 const [u,db,sm]=await Promise.all([cu('user').catch(()=>null),cu('db').catch(()=>null),cu('sample').catch(()=>null)]);
 sample=sm;if(sample){try{const l=await sample.limits();imgOK=!!(l&&l.images)}catch(e){imgOK=false}}aiReady=true;
 let id=null;try{id=u?await u.id():null}catch(e){}
 if(db&&id){col=db.collection('data/users/'+id);S.remote=true;S.docs={};
  const to=setTimeout(()=>{$('#sync').textContent='接続を待っています…'},10000);
  col.onSnapshot(snap=>{S.docs={};snap.docs.forEach(d=>{if(d.exists)S.docs[d.id]=d.data()});if(!snap.metadata.fromCache){S.synced=true;clearTimeout(to)}render()},
   e=>{clearTimeout(to);console.warn(e);S.synced=true;$('#sync').textContent='';toast('データに接続できませんでした。表示が古い可能性があります')});
 }
 render(true)})();
}
</script>
